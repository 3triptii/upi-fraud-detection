<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPI Fraud Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
        }

        .high {
            background: #fee2e2;
            border: 1px solid #ef4444;
        }

        .medium {
            background: #fef3c7;
            border: 1px solid #f59e0b;
        }

        .low {
            background: #dcfce7;
            border: 1px solid #22c55e;
        }

        .result-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .result-item {
            margin: 6px 0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>UPI Fraud Detection</h1>

    <p class="subtitle">
        Real-time transaction risk analysis using Machine Learning
    </p>

    <div class="form-group">
        <label>Transaction Amount (₹)</label>
        <input id="amount" type="number" value="8500">
    </div>

    <div class="form-group">
        <label>Transaction Hour</label>
        <input id="transaction_hour" type="number" value="2">
    </div>

    <div class="form-group">
        <label>Merchant Category</label>
        <input id="merchant_category" type="text" value="electronics">
    </div>

    <div class="form-group">
        <label>Device Type</label>
        <input id="device_type" type="text" value="unknown">
    </div>

    <div class="form-group">
        <label>Location</label>
        <input id="location" type="text" value="Delhi">
    </div>

    <div class="form-group">
        <label>Failed Attempts</label>
        <input id="failed_attempts" type="number" value="3">
    </div>

    <div class="form-group">
        <label>Account Age (days)</label>
        <input id="account_age_days" type="number" value="12">
    </div>

    <button onclick="checkTransaction()">
        Check Transaction
    </button>

    <div id="result"></div>

</div>

<script>

async function checkTransaction() {

    const transaction = {
        amount: Number(document.getElementById("amount").value),
        transaction_hour: Number(
            document.getElementById("transaction_hour").value
        ),
        merchant_category:
            document.getElementById("merchant_category").value,
        device_type:
            document.getElementById("device_type").value,
        location:
            document.getElementById("location").value,
        failed_attempts: Number(
            document.getElementById("failed_attempts").value
        ),
        account_age_days: Number(
            document.getElementById("account_age_days").value
        )
    };

    try {

        const response = await fetch(
            "http://127.0.0.1:8000/predict",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(transaction)
            }
        );

        const result = await response.json();

        const resultBox = document.getElementById("result");

        resultBox.style.display = "block";

        resultBox.className =
            result.risk_level.toLowerCase();

        resultBox.innerHTML = `
            <div class="result-title">
                ${result.risk_level === "HIGH"
                    ? "🚨 Fraud Risk Detected"
                    : result.risk_level === "MEDIUM"
                    ? "⚠️ Transaction Needs Review"
                    : "✅ Transaction Appears Safe"}
            </div>

            <div class="result-item">
                <strong>Fraud Probability:</strong>
                ${(result.fraud_probability * 100).toFixed(2)}%
            </div>

            <div class="result-item">
                <strong>Risk Level:</strong>
                ${result.risk_level}
            </div>

            <div class="result-item">
                <strong>Recommended Action:</strong>
                ${result.action}
            </div>
        `;

    } catch (error) {

        const resultBox = document.getElementById("result");

        resultBox.style.display = "block";
        resultBox.className = "high";

        resultBox.innerHTML = `
            <div class="result-title">
                ❌ API Connection Error
            </div>

            <p>
                Make sure the FastAPI server is running on
                http://127.0.0.1:8000
            </p>
        `;
    }
}

</script>

</body>
</html>
